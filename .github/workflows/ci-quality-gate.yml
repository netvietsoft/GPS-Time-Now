name: NextAI Quality & Security Gate (V2.1.2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-security-gate:
    name: Backend Build, 15-Group Audit Suite & Android Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Install Backend Dependencies (Clean Lockfile)
        working-directory: Backend
        run: npm ci

      - name: Build Backend TypeScript
        working-directory: Backend
        run: npm run build

      - name: Run 15-Group Backend Security, Billing, Anti-Fake, Earn & Persistence Suite
        working-directory: Backend
        run: npm test

      - name: Verify Android HTTPS-Only Manifest & Network Security Config (AUD-006)
        run: |
          grep -q 'android:usesCleartextTraffic="false"' apps/android/app/src/main/AndroidManifest.xml
          grep -q '<base-config cleartextTrafficPermitted="false">' apps/android/app/src/main/res/xml/network_security_config.xml
          ! grep -q '192\.168\.' apps/android/app/src/main/res/xml/network_security_config.xml
          ! grep -q 'nextai-dev-jwt-token-v1' apps/android/app/src/main/java/com/nextai/camera/data/remote/NextAiNetworkConfig.kt
          ! grep -q 'export const HMAC_SECRET' Backend/src/server.ts
