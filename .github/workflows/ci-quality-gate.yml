name: NextAI Quality & Security Gate (V2.1.2)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-and-android-security-gate:
    name: Backend 16-Group Audit, Android APK Build & Binary Manifest Gate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: Backend/package-lock.json

      - name: Setup Java JDK 17 for Android Compilation & Signing
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Backend Dependencies (Clean Lockfile)
        working-directory: Backend
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build Backend TypeScript
        working-directory: Backend
        run: npm run build

      - name: Run 16-Group Backend Security, Billing, Anti-Fake, Earn & Concurrency Suite
        working-directory: Backend
        run: npm test

      - name: Build Android APK from Canonical Manifest & Inspect Binary Manifest with aapt2 (REV-003)
        shell: pwsh
        run: ./apps/android/build_and_install_apk.ps1 -SkipDeploy

      - name: Run Full Master Quality Gate & Unified Test Runner (REV-003, REV-004, REV-006)
        shell: pwsh
        run: ./scripts/test.ps1
